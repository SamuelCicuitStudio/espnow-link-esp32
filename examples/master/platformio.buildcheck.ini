[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc1-n8r8
framework = arduino
monitor_speed = 115200
lib_deps =
  symlink://../..
board_build.partitions = partitions_8M.csv
build_flags =
  -std=gnu++17
  -DESPNOW_LINK_PMK='"A7F3C91D4E2B86A0"'
build_src_filter = +<*> -<MKSDNAND.cpp>
